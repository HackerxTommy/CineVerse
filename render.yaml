# Render Blueprint — Single-service deployment for CineVerse
# The root Dockerfile builds the React client and bundles it into the Node server.
# Usage: Go to https://render.com/deploy → paste your GitHub repo URL
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cineverse
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false                # ⚠️ Set manually — MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false                # ⚠️ Set to this service's URL (e.g. https://cineverse.onrender.com)
      - key: GOOGLE_CLIENT_ID
        sync: false                # Optional — Google OAuth
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false                # Optional — Stripe payments
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
