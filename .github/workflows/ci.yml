name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # Lint and build the client (Vite + React)
  # ──────────────────────────────────────────
  client:
    name: Client - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

  # ──────────────────────────────────────────
  # Lint the server (Node.js + Express)
  # ──────────────────────────────────────────
  server:
    name: Server - Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax (node --check)
        run: |
          for file in $(find . -name '*.js' -not -path './node_modules/*'); do
            node --check "$file"
          done

  # ──────────────────────────────────────────
  # Build Docker images (for local/docker-compose use)
  # ──────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [client, server]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build unified image (root Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cineverse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
