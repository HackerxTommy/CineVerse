name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────
  # Build & deploy via Vercel
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy info
        run: |
          echo "✅ Push to main detected!"
          echo "📦 Vercel will auto-deploy via GitHub integration."
          echo ""
          echo "If you haven't connected yet:"
          echo "  1. Go to https://vercel.com/new"
          echo "  2. Import your GitHub repo"
          echo "  3. Vercel will auto-detect vercel.json"
          echo "  4. Add environment variables in Vercel dashboard"
